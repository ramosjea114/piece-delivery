<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHP Price Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 16px;
        margin: 0;
    }

    .container {
        max-width: 420px;
        margin: auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 12px;
        margin-bottom: 4px;
        font-size: 14px;
    }

    .input-group {
        position: relative;
    }

    .peso {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-weight: bold;
        color: #555;
    }

    input[type="number"] {
        width: 100%;
        padding: 10px 10px 10px 26px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    input[readonly] {
        background-color: #f0f0f0;
    }

    .radio-group {
        margin-top: 10px;
    }

    .radio-group label {
        display: inline-block;
        margin-right: 15px;
        font-size: 14px;
    }
</style>
</head>

<body onload="calculate()">

<div class="container">
    <h2>PHP Price Calculator</h2>

    <!-- Formula Selector -->
    <label>Select Formula</label>
    <div class="radio-group">
        <label>
            <input type="radio" name="formula" value="mycar" checked onchange="calculate()">
            MyCar
        </label>
        <label>
            <input type="radio" name="formula" value="expolink" onchange="calculate()">
            ExpoLink
        </label>
    </div>

    <!-- Base Price -->
    <label>Textbox 1 – Base Price</label>
    <div class="input-group">
        <span class="peso">₱</span>
        <input
            type="number"
            id="t1"
            step="0.01"
            oninput="calculate()"
            placeholder="Enter price"
        >
    </div>

    <!-- Final Price -->
    <label>Textbox 9 – Final Price</label>
    <div class="input-group">
        <span class="peso">₱</span>
        <input type="number" id="t9" readonly>
    </div>
</div>

<script>
function round2(value) {
    return Math.round(value * 100) / 100;
}

function getSelectedFormula() {
    const radios = document.getElementsByName("formula");
    for (let r of radios) {
        if (r.checked) return r.value;
    }
    return "mycar";
}

function calculate() {
    const t1 = parseFloat(document.getElementById("t1").value) || 0;
    const selected = getSelectedFormula();

    let t9 = 0;

    if (selected === "mycar") {
        // MyCar formula
        t9 = t1 * 0.558669836875;
    } 
    else if (selected === "expolink") {
        // ExpoLink formula
        t9 = t1 * 0.5 * 0.9;
    }

    t9 = round2(t9);
    document.getElementById("t9").value = t9.toFixed(2);
}
</script>

</body>
</html>
